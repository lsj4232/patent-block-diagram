<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>특허 블록도 에디터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <button id="btn-box">박스</button>
    <button id="btn-round">둥근 박스</button>
    <button id="btn-diamond">마름모</button>
    <button id="btn-cyl">원기둥</button>
    <button id="btn-text" title="테두리 없는 글자만">텍스트</button>
    <span class="sep"></span>
    <button id="btn-arrow">화살표 연결</button>
    <button id="btn-tag">부호 태그</button>
    <button id="btn-style">직선 ⇄ 직각</button>
    <button id="btn-dash">실선 ⇄ 점선</button>
    <button id="btn-frame" title="테두리·음영을 없애 글자만 남긴다">테두리 ⇄ 없음</button>
    <button id="btn-ep-reset">끝점 자동</button>
    <span class="sep"></span>
    <button id="btn-fs-down" title="글자 작게">가⁻</button>
    <span id="fs-label">-</span>
    <button id="btn-fs-up" title="글자 크게">가⁺</button>
    <button id="btn-fs-reset" title="기본 크기(15)로">기본</button>
    <span class="sep"></span>
    <button id="btn-front">앞으로</button>
    <button id="btn-back">뒤로</button>
    <span class="sep"></span>
    <span id="sel-label"></span>
    <textarea id="edit-text" rows="2" placeholder="박스를 선택하면 여기서 텍스트 편집" disabled></textarea>
    <span class="sep"></span>
    <button id="btn-del">삭제</button>
    <span class="sep"></span>
    <button id="btn-open">열기</button>
    <button id="btn-save">저장</button>
    <button id="btn-png">PNG 내보내기</button>
    <span class="sep"></span>
    <span id="zoom-label">100%</span>
    <span id="hint">Ctrl+A: 전체 선택 &nbsp;|&nbsp; Shift+클릭: 선택 추가/해제 &nbsp;|&nbsp; Ctrl+휠: 확대/축소 &nbsp;|&nbsp; Ctrl+0: 100% &nbsp;|&nbsp; 더블클릭: 텍스트 편집 &nbsp;|&nbsp; 빈 곳 더블클릭: 박스 생성 &nbsp;|&nbsp; ⌘C·⌘V: 복사/붙여넣기 &nbsp;|&nbsp; Delete: 삭제 &nbsp;|&nbsp; ⌘Z: 실행 취소</span>
  </div>
  <div id="scroll">
    <div id="wrap">
      <svg id="canvas" width="2400" height="1600"></svg>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
